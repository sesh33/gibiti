name: RIVOX validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Start isolated PostgreSQL
        run: docker run --detach --name rivox-postgres-check --label io.rivox.disposable-test=true --network none -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
      - name: Verify PostgreSQL readiness and policies
        run: |
          for attempt in $(seq 1 30); do
            if docker exec rivox-postgres-check pg_isready -U postgres; then break; fi
            sleep 1
          done
          node scripts/verify-postgres.mjs
      - name: Remove disposable PostgreSQL
        if: always()
        run: docker rm --force rivox-postgres-check || true
